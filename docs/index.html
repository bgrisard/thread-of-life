/* ============================================================
   thread of life — v15

   CARD MODEL
   Vertical feed of Scripture cards. Each card is a contained
   step-through: Scripture, then every cross-reference one at a
   time, then Jesus, then history, then a commentary.
   Continue / back inside the card. Scroll down for the next verse.

   GOVERNING RULE
   Scripture text is NEVER generated by a language model.
   Every word of Scripture is fetched from the Free Use Bible API.
   Nothing in this file contains Scripture typed from memory.
   ============================================================ */

const API = "https://bible.helloao.org/api";
const PROXY = "https://api.allorigins.win/raw?url=";
const TIMEOUT = 15000;

/* Scripture, cross-references and commentaries need no key — they are open data.
   Only the four written steps (link note, history, Christ trace, Ask) call Claude.
   Inside a Claude artifact the key is handled for you. Running locally, put
   VITE_ANTHROPIC_API_KEY in .env.local and those steps switch on. */
const IN_ARTIFACT = typeof window !== "undefined" && !!window.storage?.get;
function getKey() {
  try { return localStorage.getItem("cr_key") || ""; } catch { return ""; }
}

/* ---------------- network with visible state ---------------- */

const net = {
  log: [],
  listeners: new Set(),
  push(entry) {
    this.log = [entry, ...this.log].slice(0, 60);
    this.listeners.forEach((f) => f(this.log));
  },
  subscribe(f) {
    this.listeners.add(f);
    return () => this.listeners.delete(f);
  },
};

async function rawJSON(url) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), TIMEOUT);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return await r.json();
  } finally {
    clearTimeout(timer);
  }
}

/* ------------------------------------------------------------------
   THE LOCAL LIBRARY
   The whole Bible ships with the app. 31,086 verses of the Berean
   Standard Bible (public domain, CC0 since 30 April 2023) and 343,608
   cross-reference links (OpenBible.info, CC BY 4.0), sharded one file
   per book so a reader downloads only what they open.

   No Scripture here was written from a language model. The Bible API
   is no longer required for reading — it remains only as a way to show
   an alternative translation.
   ------------------------------------------------------------------ */
const LIB = { index: null, verses: {}, xrefs: {}, pending: {} };
const DATA = "./data";

const bkey = (r) => `${r.book}.${r.chapter}.${r.verse}`;
const vkey = (r) => `${r.chapter}.${r.verse}`;

async function loadIndex() {
  if (LIB.index) return LIB.index;
  LIB.index = await getJSON(`${DATA}/index.json`, "index");
  return LIB.index;
}

/** Fetch a book's shard once; concurrent callers share the same promise. */
function loadBook(book) {
  if (LIB.verses[book]) return Promise.resolve(true);
  if (LIB.pending[book]) return LIB.pending[book];
  LIB.pending[book] = Promise.all([
    getJSON(`${DATA}/verses/${book}.json`, `verses ${book}`),
    getJSON(`${DATA}/xrefs/${book}.json`, `xrefs ${book}`).catch(() => ({})),
  ])
    .then(([v, x]) => {
      LIB.verses[book] = v;
      LIB.xrefs[book] = x;
      return true;
    })
    .finally(() => {
      delete LIB.pending[book];
    });
  return LIB.pending[book];
}

const haveBook = (book) => !!LIB.verses[book];
const isOmitted = (r) => !!LIB.index?.omitted?.includes(bkey(r));

function localPassage(ref) {
  const t = LIB.verses[ref.book]?.[vkey(ref)];
  if (!t) return null;
  return {
    heading: null,
    verses: [{ n: ref.verse, segs: [{ text: t, red: false }] }],
    translationName: LIB.index?.translation || "BSB",
    bookName: BOOK_MAP[ref.book]?.name || ref.book,
    source: "local",
  };
}

function localXrefs(ref) {
  const rows = LIB.xrefs[ref.book]?.[vkey(ref)];
  if (!rows?.length) return null;
  return rows.slice(0, 5).map(([k, score]) => {
    const [b, c, v] = k.split(".");
    return { book: b, chapter: Number(c), verse: Number(v), score };
  });
}

const cache = new Map();

/** Try the API directly. If the browser blocks it (CORS) or it fails,
 *  retry once through a public read-only proxy. Every attempt is logged. */
async function getJSON(url, label) {
  if (cache.has(url)) return cache.get(url);
  const started = Date.now();
  const p = (async () => {
    try {
      const d = await rawJSON(url);
      net.push({ label, url, route: "direct", ok: true, ms: Date.now() - started });
      return d;
    } catch (e1) {
      const m1 = String(e1?.message || e1);
      try {
        const d = await rawJSON(PROXY + encodeURIComponent(url));
        net.push({ label, url, route: "proxy", ok: true, ms: Date.now() - started, note: `direct failed: ${m1}` });
        return d;
      } catch (e2) {
        const msg = `direct: ${m1} · proxy: ${String(e2?.message || e2)}`;
        net.push({ label, url, route: "none", ok: false, ms: Date.now() - started, note: msg });
        throw new Error(msg);
      }
    }
  })();
  cache.set(url, p);
  try {
    return await p;
  } catch (e) {
    cache.delete(url);
    throw e;
  }
}

const getChapter = (tr, book, ch) => getJSON(`${API}/${tr}/${book}/${ch}.json`, `${tr} ${book} ${ch}`);
const getXrefChapter = (book, ch) => getJSON(`${API}/d/open-cross-ref/${book}/${ch}.json`, `xref ${book} ${ch}`);
const getCommentaryChapter = (id, book, ch) => getJSON(`${API}/c/${id}/${book}/${ch}.json`, `${id} ${book} ${ch}`);

function verseSegments(item) {
  const out = [];
  for (const c of item.content || []) {
    if (typeof c === "string") out.push({ text: c, red: false });
    else if (c && typeof c === "object" && typeof c.text === "string")
      out.push({ text: c.text, red: !!c.wordsOfJesus });
  }
  return out;
}
const segsToString = (segs) => segs.map((s) => s.text).join(" ").replace(/\s+/g, " ").trim();
const headingText = (item) =>
  (item.content || []).map((x) => (typeof x === "string" ? x : x?.text || "")).join(" ").trim();

function refLabel(r) {
  const name = BOOK_MAP[r.book]?.name || r.book;
  const v = r.endVerse && r.endVerse > r.verse ? `${r.verse}–${r.endVerse}` : `${r.verse}`;
  return `${name} ${r.chapter}:${v}`;
}
const refKey = (r) => `${r.book}.${r.chapter}.${r.verse}`;
const keyToRef = (k) => {
  const [book, c, v] = k.split(".");
  return { book, chapter: Number(c), verse: Number(v) };
};
const clampChapter = (book, ch) => {
  const b = BOOK_MAP[book];
  return b ? Math.max(1, Math.min(b.ch, ch)) : ch;
};

/** Read a verse. The local library answers; the API is only for an
 *  alternative translation the reader has explicitly chosen. */
async function loadPassage(tr, ref) {
  await loadBook(ref.book);
  const local = localPassage(ref);
  if (local && tr === (LIB.index?.translation || "BSB")) return local;
  if (!local) {
    if (isOmitted(ref)) throw new Error("OMITTED");
    throw new Error(`${refLabel(ref)} is not in the library`);
  }
  try {
    return await loadPassageLive(tr, ref);
  } catch {
    return local;
  }
}

async function loadPassageLive(tr, ref) {
  const data = await getChapter(tr, ref.book, clampChapter(ref.book, ref.chapter));
  const content = data?.chapter?.content || [];
  const to = ref.endVerse && ref.endVerse > ref.verse ? ref.endVerse : ref.verse;
  const verses = [];
  let running = null;
  let heading = null;
  for (const it of content) {
    if (it?.type === "heading") {
      running = headingText(it);
      continue;
    }
    if (it?.type !== "verse") continue;
    if (it.number >= ref.verse && it.number <= to) {
      if (!verses.length) heading = running;
      const segs = verseSegments(it);
      if (segsToString(segs)) verses.push({ n: it.number, segs });
    }
  }
  return {
    heading,
    verses,
    translationName: data?.translation?.shortName || tr,
    bookName: data?.book?.commonName || BOOK_MAP[ref.book]?.name || ref.book,
    source: "live",
  };
}

async function loadXrefs(ref) {
  await loadBook(ref.book);
  return localXrefs(ref) || [];
}

async function loadXrefsLive(ref) {
  const d = await getXrefChapter(ref.book, clampChapter(ref.book, ref.chapter));
  const row = (d?.chapter?.content || []).find((v) => v.verse === ref.verse);
  if (!row) return [];
  return (row.references || [])
    .filter((r) => BOOK_MAP[r.book])
    .slice(0, 5)
    .map((r) => ({ book: r.book, chapter: r.chapter, verse: r.verse, endVerse: r.endVerse, score: r.score ?? 0 }));
}

async function loadCommentaryNote(id, ref) {
  const d = await getCommentaryChapter(id, ref.book, clampChapter(ref.book, ref.chapter));
  const content = d?.chapter?.content || [];
  const toText = (it) => (it.content || []).map((c) => (typeof c === "string" ? c : c?.text || "")).join(" ");
  let hit = content.find((c) => c.type === "verse" && c.number === ref.verse);
  if (!hit) {
    const before = content.filter((c) => c.type === "verse" && c.number < ref.verse);
    hit = before.length ? before[before.length - 1] : null;
  }
  const text = trimTo(hit ? toText(hit) : d?.chapter?.introduction || "", 1000);
  return text ? { text, onVerse: hit?.number ?? null } : null;
}

function trimTo(s, n) {
  const clean = String(s || "").replace(/\s+/g, " ").trim();
  if (!clean || clean.length <= n) return clean;
  const cut = clean.slice(0, n);
  const stop = Math.max(cut.lastIndexOf(". "), cut.lastIndexOf("; "), cut.lastIndexOf("? "));
  return (stop > n * 0.5 ? cut.slice(0, stop + 1) : cut) + " …";
}


/* ---------------- model, with a cache so back/forward is free ---------------- */

const modelCache = new Map();

/* Every step of a card is mounted at once, so without a queue the model calls
   all fire together and the API answers 429. Requests run two at a time, in
   order, and back off when the limit is hit. */
const queue = { running: 0, waiting: [], MAX: 2 };

function enqueue(fn) {
  return new Promise((resolve, reject) => {
    queue.waiting.push({ fn, resolve, reject });
    pump();
  });
}

function pump() {
  while (queue.running < queue.MAX && queue.waiting.length) {
    const job = queue.waiting.shift();
    queue.running++;
    job
      .fn()
      .then(job.resolve, job.reject)
      .finally(() => {
        queue.running--;
        pump();
      });
  }
}

const wait = (ms) => new Promise((r) => setTimeout(r, ms));

async function callModel(system, user) {
  let delay = 1200;
  for (let attempt = 0; attempt < 4; attempt++) {
    const API_KEY = getKey();
    const headers = { "Content-Type": "application/json" };
    if (API_KEY) {
      headers["x-api-key"] = API_KEY;
      headers["anthropic-version"] = "2023-06-01";
      headers["anthropic-dangerous-direct-browser-access"] = "true";
    } else if (!IN_ARTIFACT) {
      throw new Error("NO_KEY");
    }

    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers,
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system,
        messages: [{ role: "user", content: user }],
      }),
    });

    if (res.status === 429 || res.status === 529) {
      const retryAfter = Number(res.headers.get("retry-after"));
      await wait(Number.isFinite(retryAfter) && retryAfter > 0 ? retryAfter * 1000 : delay);
      delay *= 2;
      continue;
    }

    const data = await res.json();
    if (data?.type === "error") {
      if (data?.error?.type === "rate_limit_error") {
        await wait(delay);
        delay *= 2;
        continue;
      }
      throw new Error(data?.error?.message || "model error");
    }

    const text = (data?.content || []).filter((c) => c.type === "text").map((c) => c.text).join("\n");
    const clean = text.replace(/```json/g, "").replace(/```/g, "").trim();
    const a = clean.indexOf("{");
    const b = clean.lastIndexOf("}");
    if (a < 0 || b < 0) throw new Error("model returned no JSON");
    return JSON.parse(clean.slice(a, b + 1));
  }
  throw new Error("BUSY");
}

async function claude(system, user, key) {
  if (key && modelCache.has(key)) return modelCache.get(key);
  const started = Date.now();
  const p = enqueue(() => callModel(system, user));
  if (key) modelCache.set(key, p);
  try {
    const r = await p;
    net.push({ label: key || "claude", url: "api.anthropic.com", route: "direct", ok: true, ms: Date.now() - started });
    return r;
  } catch (e) {
    if (key) modelCache.delete(key);
    net.push({ label: key || "claude", url: "api.anthropic.com", route: "none", ok: false, ms: Date.now() - started, note: String(e?.message || e) });
    throw e;
  }
}

async function storeGet(key, fallback) {
  try {
    if (typeof window !== "undefined" && window.storage?.get) {
      const r = await window.storage.get(key);
      return r ? JSON.parse(r.value) : fallback;
    }
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch {
    return fallback;
  }
}
async function storeSet(key, value) {
  try {
    if (typeof window !== "undefined" && window.storage?.set) {
      await window.storage.set(key, JSON.stringify(value));
      return;
    }
    localStorage.setItem(key, JSON.stringify(value));
  } catch {}
}

.cr-logline[data-ok="false"] { color: #9B2C1E; }
`;

/* Each stage of a card carries its own colour, so where you are is legible
   before you read a word. */
const STAGES = {
  scripture:  { label: "Scripture",       color: "#9B2C1E", wash: "#FBF2F0" },
  christ:     { label: "Finding Jesus",   color: "#8A6516", wash: "#FAF4E8" },
  link:       { label: "Cross-reference", color: "#2E4A7D", wash: "#EFF2F8" },
  history:    { label: "Where and when",  color: "#3B6550", wash: "#EEF5F1" },
  commentary: { label: "Commentary",      color: "#65407A", wash: "#F5EFF8" },
};

/* Every kind of connection the app can claim gets its own colour, so the
   nature of a link is legible at a glance. */
const KINDS = {
  "fulfillment":                     { c: "#8A2E6A", w: "#F9EFF6" },
  "quotation":                       { c: "#2E4A7D", w: "#EFF2F8" },
  "type or shadow":                  { c: "#7A5210", w: "#FAF3E6" },
  "promise":                         { c: "#1F6670", w: "#EAF4F5" },
  "covenant promise":                { c: "#1F6670", w: "#EAF4F5" },
  "same event":                      { c: "#4A5568", w: "#F0F1F4" },
  "same theme":                      { c: "#3B6550", w: "#EEF5F1" },
  "contrast":                        { c: "#9B2C1E", w: "#FBF2F0" },
  "echo":                            { c: "#65407A", w: "#F5EFF8" },
  "direct prophecy":                 { c: "#8A2E6A", w: "#F9EFF6" },
  "attribute of God shown in Christ": { c: "#7A5210", w: "#FAF3E6" },
  "need that Christ answers":        { c: "#9B2C1E", w: "#FBF2F0" },
  "words or acts of Christ":         { c: "#8A6516", w: "#FAF4E8" },
  "direct":                          { c: "#2E4A7D", w: "#EFF2F8" },
  "thematic":                        { c: "#3B6550", w: "#EEF5F1" },
};

function Kind({ children }) {
  if (!children) return null;
  const k = KINDS[String(children).toLowerCase()] || { c: "#4A5568", w: "#F0F1F4" };
  return <span className="cr-kind" style={{ color: k.c, background: k.w, borderColor: k.c }}>{children}</span>;
}


/* ============================================================
   PRIMITIVES
   ============================================================ */

const Skeleton = ({ lines = 3 }) => (
  <div aria-busy="true">
    {Array.from({ length: lines }).map((_, i) => (
      <div key={i} className="cr-skel" style={{ width: i === lines - 1 ? "58%" : "100%" }} />
    ))}
  </div>
);

function Foot({ status, children }) {
  const [open, setOpen] = useState(false);
  return (
    <>
      <div className="cr-meta">
        {(status || []).map((it, i) => (
          <span key={i} className="cr-stat" data-s={it.state}>
            {it.name}{it.detail ? ` ${it.detail}` : ""}
          </span>
        ))}
        <button className="cr-srcbtn" onClick={() => setOpen(!open)}>{open ? "hide source" : "source"}</button>
      </div>
      {open ? <div className="cr-srctext">{children}</div> : null}
    </>
  );
}

const Source = ({ children }) => <div className="cr-srctext">{children}</div>;

function NoteError({ error }) {
  if (String(error).includes("BUSY"))
    return (
      <p className="cr-body cr-quiet">
        The writing service is busy. This step will fill in — scroll on and come back to it.
      </p>
    );
  if (String(error).includes("NO_KEY"))
    return (
      <p className="cr-body cr-quiet">
        Written steps are off. Open the Debug tab and paste an Anthropic API key to switch them on.
        Scripture, cross-references and commentary work without a key.
      </p>
    );
  return <p className="cr-body cr-quiet">Unavailable: {String(error)}</p>;
}

function ScriptureText({ passage, numbers = true }) {
  if (!passage?.verses?.length) return null;
  return (
    <p className="cr-scripture">
      {passage.verses.map((v, vi) => (
        <span key={v.n}>
          {numbers && passage.verses.length > 1 ? <span className="cr-vn">{v.n}</span> : null}
          {v.segs.map((s, i) => (
            <span key={i} className={s.red ? "cr-red" : undefined}>
              {s.text}
              {i < v.segs.length - 1 ? " " : ""}
            </span>
          ))}
          {vi < passage.verses.length - 1 ? " " : ""}
        </span>
      ))}
    </p>
  );
}

/** Small chips showing the real state of each request behind this step. */
function StatusStrip({ items }) {
  if (!items?.length) return null;
  return (
    <div className="cr-status">
      {items.map((it, i) => (
        <span key={i} className="cr-stat" data-s={it.state}>
          {it.name}
          {it.state === "ok" && it.detail ? ` ✓ ${it.detail}` : it.state === "ok" ? " ✓" : ""}
          {it.state === "load" ? " …" : ""}
          {it.state === "fail" ? " ✕" : ""}
        </span>
      ))}
    </div>
  );
}

/* ============================================================
   STEP CONTENT
   ============================================================ */

function useAsync(fn, deps, seed = null, enabled = true) {
  const [state, setState] = useState(
    seed ? { status: "ok", data: seed, error: null } : { status: "load", data: null, error: null }
  );
  useEffect(() => {
    if (!enabled) return;
    let live = true;
    if (!seed) setState({ status: "load", data: null, error: null });
    Promise.resolve()
      .then(fn)
      .then((d) => live && setState({ status: "ok", data: d, error: null }))
      .catch((e) => live && setState({ status: "fail", data: null, error: String(e?.message || e) }));
    return () => {
      live = false;
    };
  }, [...deps, enabled]);
  return state;
}

function StepScripture({ card, onOpenChapter, onAsk, onSave, saved }) {
  const p = card.passage;
  return (
    <>
      {p.heading ? <div className="cr-heading">{p.heading}</div> : null}
      <ScriptureText passage={p} />
      <div className="cr-ref">{refLabel(card.ref)}</div>

      <div className="cr-actions">
        <button onClick={() => onOpenChapter(card.ref)}>Chapter</button>
        <button onClick={() => onAsk(card.ref)}>Ask</button>
        <button data-on={saved} onClick={() => onSave(card.ref)}>{saved ? "Saved" : "Save"}</button>
      </div>

      <Foot
        status={[
          { name: p.source === "live" ? "live" : "bundled", state: "ok", detail: p.translationName },
          { name: "refs", state: card.branches.length ? "ok" : "fail", detail: String(card.branches.length) },
        ]}
      >
        Scripture is fetched or served from the bundled library — never model-generated.
        Cross-references: OpenBible.info, CC BY 4.0.
      </Foot>
    </>
  );
}

function StepLink({ from, to, index, total, translation, onFollow, near }) {
  const pass = useAsync(() => loadPassage(translation, to), [refKey(to), translation], localPassage(to), near);
  const note = useAsync(
    () =>
      claude(
        P_LINK,
        `FROM (reader is here): ${refLabel(from)}\nTO (the reference): ${refLabel(to)}\nRelevance score in the OpenBible dataset: ${to.score}`,
        `link:${refKey(from)}>${refKey(to)}`
      ),
    [refKey(from), refKey(to)],
    null,
    near
  );

  return (
    <>
      {pass.status === "load" ? <Skeleton lines={3} /> : null}
      {pass.status === "fail" ? <p className="cr-body cr-quiet">Could not load {refLabel(to)}.</p> : null}
      {pass.data ? (
        <>
          <ScriptureText passage={pass.data} />
          <div className="cr-ref">{refLabel(to)}</div>
        </>
      ) : null}

      <div style={{ marginTop: 22 }}>
        {note.status === "load" ? <Skeleton lines={3} /> : null}
        {note.status === "fail" ? <NoteError error={note.error} /> : null}
        {note.status === "ok" ? (
          <>
            <Kind>{note.data.kind}</Kind>
            <p className="cr-body" style={{ marginTop: 12 }}>{note.data.connection}</p>
            <p className="cr-body cr-quiet">{note.data.witness}</p>
          </>
        ) : null}
      </div>

      <div className="cr-row">
        <button className="cr-btn cr-solid" onClick={() => onFollow(to)}>Follow this one</button>
      </div>

      <Foot
        status={[
          { name: pass.data?.source === "live" ? "live" : "bundled", state: "ok", detail: pass.data?.translationName },
          { name: "note", state: note.status },
        ]}
      >
        Link from OpenBible.info (Treasury of Scripture Knowledge), CC BY 4.0. Verse text fetched or
        bundled; the note is written by Claude and never contains Scripture.
      </Foot>
    </>
  );
}

function StepChrist({ target, translation, onFollow, near }) {
  const trace = useAsync(() => claude(P_CHRIST, `PASSAGE: ${refLabel(target)}`, `christ:${refKey(target)}`), [refKey(target)], null, near);
  const [landing, setLanding] = useState(null);

  useEffect(() => {
    const L = trace.data?.landing;
    if (!L || !BOOK_MAP[L.book]) return;
    let live = true;
    const ref = { book: L.book, chapter: Number(L.chapter), verse: Number(L.verse) };
    loadPassage(translation, ref)
      .then((p) => live && p.verses.length && setLanding({ ref, passage: p }))
      .catch(() => {});
    return () => { live = false; };
  }, [trace.data]);

  return (
    <>
      {trace.status === "load" ? <Skeleton lines={4} /> : null}
      {trace.status === "fail" ? <NoteError error={trace.error} /> : null}
      {trace.status === "ok" ? (
        <>
          <Kind>{trace.data.kind}</Kind>
          <p className="cr-lede" style={{ marginTop: 12 }}>{trace.data.thread}</p>
        </>
      ) : null}
      {landing ? (
        <>
          <div className="cr-label" style={{ marginTop: 20 }}>Turn here</div>
          <ScriptureText passage={landing.passage} numbers={false} />
          <div className="cr-ref">{refLabel(landing.ref)}</div>
          <div className="cr-row">
            <button className="cr-btn cr-solid" onClick={() => onFollow(landing.ref)}>Follow the thread here</button>
          </div>
        </>
      ) : null}
      <Foot
        status={[
          { name: "trace", state: trace.status, detail: trace.data?.kind },
          { name: "landing", state: landing ? "ok" : trace.status === "ok" ? "fail" : "load", detail: landing ? refLabel(landing.ref) : "" },
        ]}
      >
        Written under the Christ-thread guardrail; it must name what kind of connection it claims. A
        landing reference that will not resolve is dropped rather than shown.
      </Foot>
    </>
  );
}

function StepHistory({ target, near }) {
  const h = useAsync(() => claude(P_HISTORY, `PASSAGE: ${refLabel(target)}`, `hist:${refKey(target)}`), [refKey(target)], null, near);
  const d = h.data;
  return (
    <>
      {h.status === "load" ? <Skeleton lines={5} /> : null}
      {h.status === "fail" ? <NoteError error={h.error} /> : null}
      {d ? (
        <>
          <p className="cr-lede">{d.setting}</p>
          {d.established?.length ? (
            <>
              <div className="cr-label" style={{ marginTop: 16 }}>Well attested</div>
              <ul className="cr-list">{d.established.map((x, i) => <li key={i}>{x}</li>)}</ul>
            </>
          ) : null}
          {d.heldLoosely?.length ? (
            <div className="cr-held">
              <h4>Held loosely</h4>
              <ul className="cr-list" style={{ marginBottom: 0 }}>{d.heldLoosely.map((x, i) => <li key={i}>{x}</li>)}</ul>
            </div>
          ) : null}
          {d.matters ? <p className="cr-body" style={{ marginTop: 14 }}>{d.matters}</p> : null}
        </>
      ) : null}
      <Foot status={[{ name: "background", state: h.status }]}>
        Background is not Scripture. Where the historical record and Scripture appear to differ, this app
        holds to Scripture and treats the record as partial.
      </Foot>
    </>
  );
}

function StepCommentary({ target, commentary, near }) {
  const c = useAsync(() => loadCommentaryNote(commentary.id, target), [commentary.id, refKey(target)], null, near);
  return (
    <>
      {c.status === "load" ? <Skeleton lines={5} /> : null}
      {c.status === "fail" || (c.status === "ok" && !c.data) ? (
        <p className="cr-body cr-quiet">
          No note available at {refLabel(target)}. Commentaries are fetched live and are not bundled.
        </p>
      ) : null}
      {c.data ? (
        <>
          <p className="cr-commentary">{c.data.text}</p>
          <div className="cr-ref">
            {commentary.name}, on {BOOK_MAP[target.book]?.name} {target.chapter}{c.data.onVerse ? `:${c.data.onVerse}` : ""}
          </div>
        </>
      ) : null}
      <Foot status={[{ name: commentary.id, state: c.data ? "ok" : c.status === "load" ? "load" : "fail" }]}>
        Fetched verbatim from the Free Use Bible API commentary set. {commentary.license}. Not
        model-written and not edited — a historic voice, not Scripture.
      </Foot>
    </>
  );
}

/** One verse = one card. The steps scroll vertically inside it. */
function Card({ card, first, translation, onFollow, onOpenChapter, onAsk, onSave, saved, onStepDone, onNextCard }) {
  const [livePassage, setLivePassage] = useState(null);
  const [active, setActive] = useState(0);
  const pages = useRef(null);
  const wrap = useRef(null);

  useEffect(() => {
    if (card.passage?.source === "live") return;
    let alive = true;
    loadPassageLive(translation, card.ref)
      .then((p) => alive && p.verses.length && setLivePassage(p))
      .catch(() => {});
    return () => { alive = false; };
  }, [card.id, translation]);

  const shown = livePassage || card.passage;
  const anchor = refLabel(card.ref);

  const commentary = (() => {
    const pool = COMMENTARIES.filter((c) => c.scope === "all" || c.scope === BOOK_MAP[card.ref.book]?.t);
    return pool[card.step % pool.length];
  })();

  const total = (card.branches || []).length;
  const steps = [
    { kind: "scripture", now: anchor },
    { kind: "christ", now: "Finding Jesus here" },
  ];
  (card.branches || []).forEach((b, k) => steps.push({ kind: "link", to: b, index: k + 1, now: refLabel(b) }));
  steps.push({ kind: "history", now: "Where and when" });
  steps.push({ kind: "commentary", now: commentary.name });

  const idx = Math.min(active, steps.length - 1);
  const stage = STAGES[steps[idx].kind];

  const ctx = (st) => {
    if (st.kind === "link")
      return <>Reading <b>{refLabel(st.to)}</b> — cross-reference {st.index} of {total} from {anchor}</>;
    if (st.kind === "christ") return <>How <b>{anchor}</b> points to Jesus</>;
    if (st.kind === "history") return <>The world <b>{anchor}</b> was written into</>;
    if (st.kind === "commentary") return <>{commentary.era} · commentary on <b>{anchor}</b></>;
    return first ? <>Today's thread starts at <b>{anchor}</b></> : <>Verse {card.step} of your thread</>;
  };

  const body = (st, i) => {
    const near = Math.abs(i - idx) <= 1;
    switch (st.kind) {
      case "scripture":
        return <StepScripture card={{ ...card, passage: shown }} onOpenChapter={onOpenChapter} onAsk={onAsk} onSave={onSave} saved={saved} />;
      case "link":
        return <StepLink from={card.ref} to={st.to} index={st.index} total={total} translation={translation} onFollow={onFollow} near={near} />;
      case "christ":
        return <StepChrist target={card.ref} translation={translation} onFollow={onFollow} near={near} />;
      case "history":
        return <StepHistory target={card.ref} near={near} />;
      case "commentary":
        return <StepCommentary target={card.ref} commentary={commentary} near={near} />;
      default:
        return null;
    }
  };

  const onScroll = (e) => {
    const el = e.currentTarget;
    const n = Math.round(el.scrollTop / Math.max(1, el.clientHeight));
    setActive((cur) => {
      if (cur === n) return cur;
      if (n >= steps.length - 1) onStepDone?.(card);
      return n;
    });
  };

  return (
    <div className="cr-cardwrap" ref={wrap}>
      <article className="cr-card" style={{ "--stage": stage.color, "--wash": stage.wash }}>
        <div className="cr-card-top" />
        <div className="cr-title">
          <span className="cr-title-kicker">Studying</span>
          <span className="cr-title-ref">{anchor}</span>
          <span className="cr-title-step">verse {card.step}</span>
        </div>
        <div className="cr-card-head">
          <span className="cr-stage"><span className="dot" />{stage.label}</span>
          <span className="cr-count">{idx + 1} / {steps.length}</span>
        </div>
        <div className="cr-seg">
          {steps.map((sx, k) => (
            <i key={k} style={{ background: k <= idx ? STAGES[sx.kind].color : undefined, opacity: k === idx ? 1 : k < idx ? 0.4 : 1 }} />
          ))}
        </div>

        <div className="cr-pages" ref={pages} onScroll={onScroll}>
          {steps.map((st, i) => {
            const sc = STAGES[st.kind];
            const last = i === steps.length - 1;
            return (
              <section
                key={`${card.id}-${i}`}
                className="cr-page"
                data-first={i === 0 ? "true" : "false"}
                data-last={last ? "true" : "false"}
                style={{ "--stage": sc.color, "--wash": sc.wash }}
              >
                <span className="cr-rail" />
                <span className="cr-node" />
                <div className="cr-page-inner">
                  <div className="cr-now">{st.now}</div>
                  <div className="cr-ctx">{ctx(st)}</div>
                  <div className="cr-page-body">{body(st, i)}</div>
                  {last ? (
                    <div className="cr-row">
                      <button className="cr-btn cr-solid" onClick={() => onNextCard?.(wrap.current)}>
                        Next verse ↓
                      </button>
                    </div>
                  ) : null}
                  <div className="cr-scrollcue" data-end={last ? "true" : "false"}>
                    {last ? `End of ${anchor}` : "Scroll ↓"}
                  </div>
                </div>
              </section>
            );
          })}
        </div>
      </article>
    </div>
  );
}

function AskSheet({ target, onClose }) {
  const [q, setQ] = useState("");
  const [a, setA] = useState(null);
  const [busy, setBusy] = useState(false);
  const ask = async () => {
    if (!q.trim()) return;
    setBusy(true);
    setA(null);
    try {
      setA(await claude(P_GUIDE, `PASSAGE: ${refLabel(target)}\nQUESTION: ${q.trim()}`));
    } catch (e) {
      setA({ answer: `That could not be answered right now (${String(e.message || e)}).`, seeAlso: [] });
    }
    setBusy(false);
  };
  return (
    <Sheet onClose={onClose}>
      <div className="cr-h1">Ask about this</div>
      <p className="cr-sub">{refLabel(target)}</p>
      <input
        className="cr-input"
        value={q}
        placeholder="What is this passage doing here?"
        onChange={(e) => setQ(e.target.value)}
        onKeyDown={(e) => e.key === "Enter" && ask()}

      <div className="cr-row">
        <button className="cr-btn cr-solid" onClick={ask} disabled={busy}>{busy ? "Thinking…" : "Ask"}</button>
      </div>
      {busy ? <div style={{ marginTop: 18 }}><Skeleton lines={4} /></div> : null}

        <>

  );

    for (const [name, url] of targets) {

        await rawJSON(url);
        direct = "ok";
      } catch (e) {
        direct = String(e?.message || e);

          proxy = String(e?.message || e);
        }
      }
      out.push({ name, url, direct, proxy });

    try {
      await claude(CORE, "Return {\"ok\":true}", null);

    } catch (e) {

  const [k, setK] = useState(getKey());

const dayIndex = () => {
  const d = new Date();
  return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
};
const todayAnchor = () => {
  const a = ANCHORS[dayIndex() % ANCHORS.length];
  return { book: a[0], chapter: a[1], verse: a[2] };
};

let uid = 0;
const nextId = () => `c${++uid}`;

function CrossReference() {
  const [tab, setTab] = useState("thread");
  const [translation, setTranslation] = useState("BSB");
  const [translations, setTranslations] = useState([{ id: "BSB", short: "BSB" }]);
  const [lib, setLib] = useState(null);
  const [cards, setCards] = useState([]);
  const [trail, setTrail] = useState([]);
  const [saved, setSaved] = useState([]);
  const [status, setStatus] = useState("loading");
  const [errMsg, setErrMsg] = useState("");
  const [sheet, setSheet] = useState(null);

  const [read, setRead] = useState([]);
  const cursor = useRef(null);
  const lastRef = useRef(null);
  const seen = useRef(new Set());
  const step = useRef(0);
  const busy = useRef(false);
  const feed = useRef(null);
  const sentinel = useRef(null);

  const buildCard = useCallback(
    async (ref, from) => {
      const bp = localPassage(ref);
      let passage = bp;
      let branches = localXrefs(ref) || [];
      let xrefError = null;

      if (!bp) {
        // not in the bundle — the network is the only way to read this verse
        passage = await loadPassage(translation, ref);
        if (!passage.verses.length) return null;
        try {
          branches = await loadXrefs(ref);
        } catch (e) {
          xrefError = String(e?.message || e);
        }
      }
      seen.current.add(refKey(ref));
      const n = ++step.current;
      return {
        id: nextId(),
        ref,
        from: from || null,
        passage,
        branches,
        xrefError,
        step: n,
      };
    },
    [translation]
  );

  const pickNext = useCallback(
    (branches, from) => {
      if (branches?.length) {
        const unseen = branches.filter((b) => !seen.current.has(refKey(b)));
        let pool = unseen.length ? unseen : branches;
        const readable = pool.filter((b) => localPassage(b));
        if (readable.length) pool = readable;
        // Steer toward the gospels, then the rest of the New Testament, so the
        // thread converges on Christ rather than wandering by score alone.
        const gospels = pool.filter((b) => ["MAT", "MRK", "LUK", "JHN"].includes(b.book));
        const nt = pool.filter((b) => BOOK_MAP[b.book]?.t === "NT");
        const pick = gospels[0] || nt[0] || pool[0];
        return { book: pick.book, chapter: pick.chapter, verse: pick.verse };
      }
      // Nothing left to follow from here. Never dead-end: prefer a verse we can
      // definitely read, so the thread keeps running with no network at all.
      const nv = { book: from.book, chapter: from.chapter, verse: from.verse + 1 };
      if (!seen.current.has(refKey(nv)) && localPassage(nv)) return nv;

      // Nothing unwalked to follow — carry on through the text itself.
      const b = BOOK_MAP[from.book];
      if (!seen.current.has(refKey(nv))) return nv;
      if (b && from.chapter < b.ch) return { book: from.book, chapter: from.chapter + 1, verse: 1 };
      const idx = BOOKS.findIndex((x) => x.id === from.book);
      const nb = BOOKS[(idx + 1) % BOOKS.length];
      return { book: nb.id, chapter: 1, verse: 1 };
    },
    []
  );

  const extend = useCallback(async () => {
    if (busy.current || !cursor.current) return null;
    busy.current = true;
    try {
      let ref = cursor.current;
      const cameFrom = lastRef.current;
      let card = null;
      for (let k = 0; k < 6 && !card; k++) {
        try {
          card = await buildCard(ref, cameFrom);
        } catch {
          card = null;
        }
        if (!card) ref = pickNext([], ref);
      }
      if (card) {
        lastRef.current = card.ref;
        cursor.current = pickNext(card.branches, card.ref);
        setCards((c) => [...c, card]);
        setTrail((t) => [...t, { ref: card.ref, label: refLabel(card.ref), at: Date.now() }]);
      }
      return card;
    } finally {
      busy.current = false;
    }
  }, [buildCard, pickNext]);

  const startThread = useCallback(
    async (ref) => {
      setStatus("loading");
      setErrMsg("");
      await loadIndex().catch(() => {});
      step.current = 0;
      seen.current = new Set();
      lastRef.current = null;
      try {
        // Start exactly where asked. Only wander if that verse genuinely
        // cannot be read — and say so rather than silently landing elsewhere.
        let card = null;
        let lastErr = "";
        try {
          card = await buildCard(ref);
        } catch (e) {
          lastErr = String(e?.message || e);
        }
        if (!card) {
          throw new Error(
            lastErr.includes("OMITTED")
              ? `${refLabel(ref)} is printed as omitted in the Berean Standard Bible — the earliest manuscripts do not contain it. Choose another verse.`
              : `${refLabel(ref)} could not be opened. ${lastErr}`
          );
        }
        lastRef.current = card.ref;
        cursor.current = pickNext(card.branches, card.ref);
        setCards([card]);
        setTrail((t) => [...t, { ref: card.ref, label: refLabel(card.ref), at: Date.now() }]);
        setStatus("ready");
        if (feed.current) feed.current.scrollTop = 0;
      } catch (e) {
        setErrMsg(String(e?.message || e));
        setStatus("error");
      }
    },
    [buildCard, pickNext]
  );

  useEffect(() => {
    let live = true;
    getJSON(`${API}/available_translations.json`, "translations")
      .then((d) => {
        if (!live) return;
        const eng = (d?.translations || []).filter((t) => t.language === "eng").map((t) => ({ id: t.id, short: t.shortName || t.id }));
        const ordered = [...eng.filter((t) => t.id === "BSB"), ...eng.filter((t) => t.id !== "BSB")].slice(0, 18);
        if (ordered.length) setTranslations(ordered);
      })
      .catch(() => {});
    loadIndex().then((i) => live && setLib(i)).catch(() => {});
    storeGet("cr_saved", []).then((s) => live && setSaved(s));
    storeGet("cr_trail", []).then((t) => live && setTrail(t));
    storeGet("cr_read", []).then((r) => live && setRead(r));
    startThread(todayAnchor());
    return () => { live = false; };
  }, []);

  useEffect(() => { storeSet("cr_trail", trail.slice(-300)); }, [trail]);
  useEffect(() => { storeSet("cr_read", read.slice(-400)); }, [read]);
  useEffect(() => { storeSet("cr_saved", saved); }, [saved]);

  // Always keep several cards below you, so the feed can be scrolled before
  // you have finished the card you are on.
  useEffect(() => {
    if (status !== "ready") return;
    if (cards.length && cards.length < 2) extend();
  }, [status, cards.length, extend]);

  // Load more as the end of the thread approaches.
  useEffect(() => {
    if (status !== "ready" || !sentinel.current || !feed.current) return;
    const io = new IntersectionObserver((e) => e[0].isIntersecting && extend(), {
      root: feed.current,
      rootMargin: "600px",
    });
    io.observe(sentinel.current);
    return () => io.disconnect();
  }, [status, cards.length, extend]);

  const goNextCard = useCallback(async (wrapEl) => {
    if (cards.length < 3) await extend();
    const next = wrapEl?.nextElementSibling;
    if (next && next.classList.contains("cr-cardwrap")) {
      next.scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }
    await extend();
    setTimeout(() => {
      const all = feed.current?.querySelectorAll(".cr-cardwrap");
      const i = Array.from(all || []).indexOf(wrapEl);
      all?.[i + 1]?.scrollIntoView({ behavior: "smooth", block: "start" });
    }, 80);
  }, [cards.length, extend]);

  const markRead = useCallback((card) => {
    setRead((r) =>
      r.some((x) => x.key === refKey(card.ref))
        ? r
        : [...r, { key: refKey(card.ref), label: refLabel(card.ref), text: card.passage.verses.map((v) => v.segs.map((g) => g.text).join(" ")).join(" ").slice(0, 150), at: Date.now() }]
    );
  }, []);

  const onFollow = (ref) => {
    setTab("thread");
    startThread({ book: ref.book, chapter: ref.chapter, verse: ref.verse });
  };
  const onSave = (ref) => {
    const k = refKey(ref);
    setSaved((s) => (s.some((x) => refKey(x) === k) ? s.filter((x) => refKey(x) !== k) : [...s, ref]));
  };
  const isSaved = (ref) => saved.some((x) => refKey(x) === refKey(ref));

  const changeTranslation = (id) => {
    setTranslation(id);
    const anchor = cards[0]?.ref || todayAnchor();
    setTimeout(() => startThread(anchor), 0);
  };

  return (
    <div className="cr">
      <style>{CSS}</style>

      <header className="cr-top">
        <span className="cr-wordmark">thread of life</span>
        <div className="cr-spacer" />
        <button className="cr-tp" onClick={() => setSheet({ type: "translation" })}>{translation}</button>
      </header>

      {tab === "thread" ? (
        <>
          <div className="cr-feed" ref={feed}>
            {status === "loading" ? (
              <div className="cr-cardwrap">
                <article className="cr-card" style={{ "--stage": STAGES.scripture.color, "--wash": STAGES.scripture.wash }}>
                  <div className="cr-card-top" />
                  <div className="cr-card-head">
                    <span className="cr-stage"><span className="dot" />Scripture</span>
                  </div>
                  <div className="cr-pages">
                    <section className="cr-page" data-first="true" data-last="true">
                      <span className="cr-rail" />
                      <span className="cr-node" />
                      <div className="cr-page-inner">
                        <div className="cr-now">Drawing today's thread</div>
                        <div className="cr-page-body" style={{ marginTop: 18 }}><Skeleton lines={5} /></div>
                      </div>
                    </section>
                  </div>
                </article>
              </div>
            ) : null}

            {status === "error" ? (
              <div className="cr-cardwrap">
                <article className="cr-card" style={{ "--stage": STAGES.scripture.color, "--wash": STAGES.scripture.wash }}>
                  <div className="cr-card-top" />
                  <div className="cr-pages">
                    <section className="cr-page" data-first="true" data-last="true">
                      <span className="cr-rail" />
                      <span className="cr-node" />
                      <div className="cr-page-inner">
                        <div className="cr-now">The thread would not load</div>
                        <div className="cr-ctx">{errMsg}</div>
                        <div className="cr-page-body">
                          <div className="cr-row">
                            <button className="cr-btn cr-solid" onClick={() => startThread(todayAnchor())}>Try again</button>
                          </div>
                        </div>
                      </div>
                    </section>
                  </div>
                </article>
              </div>
            ) : null}

            {cards.map((c, ci) => (
              <Card
                key={c.id}
                card={c}
                first={ci === 0}
                translation={translation}
                onFollow={onFollow}
                onOpenChapter={(r) => setSheet({ type: "chapter", ref: r })}
                onAsk={(r) => setSheet({ type: "ask", ref: r })}
                onSave={onSave}
                saved={isSaved(c.ref)}
                onStepDone={markRead}
                onNextCard={goNextCard}
                onOpenTrace={() => setTab("trace")}
              />
            ))}
            <div ref={sentinel} style={{ height: 1 }} />
          </div>
        </>
      ) : null}

      {tab === "trace" ? (
        <div className="cr-pane">
          <h1 className="cr-h1">Your trail</h1>
          <p className="cr-sub">What you have read, and the threads you followed to get there.</p>

          <div className="cr-stats">
            <div className="cr-statbox"><b>{read.length}</b><span>verses read</span></div>
            <div className="cr-statbox">
              <b>{read.length ? (read.length < 31 ? ((read.length / BIBLE_VERSES) * 100).toFixed(3) : ((read.length / BIBLE_VERSES) * 100).toFixed(2)) : "0"}%</b>
              <span>of the Bible</span>
            </div>
            <div className="cr-statbox"><b>{new Set(read.map((r) => r.key.split(".")[0])).size}</b><span>books</span></div>
          </div>
          <p className="cr-sub" style={{ marginTop: -8 }}>
            {read.length} of {BIBLE_VERSES.toLocaleString()} verses · {trail.length} steps walked
          </p>

          <div className="cr-h2">Verses you finished</div>
          {!read.length ? (
            <div className="cr-empty">Nothing yet. Reach the last step of a card and it lands here.</div>
          ) : null}
          {read.slice().reverse().map((r) => (
            <div className="cr-tile" key={r.key}>
              <div className="cr-tile-top">
                <button className="cr-tile-ref" onClick={() => onFollow(keyToRef(r.key))}>{r.label}</button>
                <span className="cr-tile-meta">{new Date(r.at).toLocaleDateString(undefined, { month: "short", day: "numeric" })}</span>
              </div>
              {r.text ? <div className="cr-tile-text">{r.text}…</div> : null}
              <span className="cr-badge" style={{ color: STAGES.link.color, background: STAGES.link.wash }}>
                {r.refs || 0} cross-references traced
              </span>
            </div>
          ))}

          <div className="cr-h2">Every step walked</div>
          {!trail.length ? <div className="cr-empty">No steps yet.</div> : null}
          {trail.slice().reverse().slice(0, 120).map((t, i) => (
            <div className="cr-tile" key={`${t.at}-${i}`} style={{ padding: "10px 14px" }}>
              <div className="cr-tile-top">
                <button className="cr-tile-ref" onClick={() => onFollow(t.ref)}>{t.label}</button>
                <span className="cr-tile-meta">{new Date(t.at).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })}</span>
              </div>
            </div>
          ))}
        </div>
      ) : null}

      {tab === "find" ? <FindPane onJump={onFollow} /> : null}

      {tab === "debug" ? <DebugPane /> : null}

      {tab === "saved" ? (
        <div className="cr-pane">
          <h1 className="cr-h1">Saved</h1>
          <p className="cr-sub">Passages you marked while tracing.</p>
          {!saved.length ? <div className="cr-empty">Nothing saved yet.</div> : null}
          {saved.map((r) => (
            <div className="cr-tile" key={refKey(r)}>
              <div className="cr-tile-top">
                <button className="cr-tile-ref" onClick={() => onFollow(r)}>{refLabel(r)}</button>
                <button className="cr-tile-meta" style={{ background: "none", border: 0, cursor: "pointer" }} onClick={() => onSave(r)}>remove</button>
              </div>
            </div>
          ))}
        </div>
      ) : null}

      <nav className="cr-nav">
        {[["thread","❋","Thread"],["trace","⋮","Trace"],["find","⌕","Find"],["saved","♡","Saved"],["debug","⚙","Debug"]].map(([id, g, l]) => (
          <button key={id} data-on={tab === id} onClick={() => setTab(id)}>
            <span className="cr-glyph">{g}</span>{l}
          </button>
        ))}
      </nav>

      {sheet?.type === "chapter" ? (
        <ChapterSheet target={sheet.ref} translation={translation} onClose={() => setSheet(null)} onPick={(r) => { setSheet(null); onFollow(r); }} />
      ) : null}
      {sheet?.type === "ask" ? <AskSheet target={sheet.ref} onClose={() => setSheet(null)} /> : null}
      {sheet?.type === "sources" ? <SourcesSheet onClose={() => setSheet(null)} /> : null}
      {sheet?.type === "translation" ? (
        <Sheet onClose={() => setSheet(null)}>
          <div className="cr-h1">Translation</div>
          <p className="cr-sub">
            The Berean Standard Bible ships with the app and always works. Other translations are fetched
            from the Free Use Bible API and fall back to the BSB if it cannot be reached.
          </p>
          <div className="cr-grid">
            {translations.map((t) => (
              <button key={t.id} onClick={() => { setSheet(null); changeTranslation(t.id); }}
                style={t.id === translation ? { borderColor: "var(--rubric)", color: "var(--rubric)" } : undefined}>
                {t.short}
              </button>
            ))}
          </div>
          <Source>All translations served by the Free Use Bible API.</Source>
        </Sheet>
      ) : null}
    </div>
  );
}

function FindPane({ onJump }) {
  const [book, setBook] = useState(null);
  const [chapter, setChapter] = useState(null);
  const [filter, setFilter] = useState("");

  if (!book) {
    const list = BOOKS.filter((b) => b.name.toLowerCase().includes(filter.toLowerCase()));
    return (
      <div className="cr-pane">
        <h1 className="cr-h1">Start anywhere</h1>
        <p className="cr-sub">Pick a passage and the thread runs from it.</p>
        <input className="cr-input" placeholder="Find a book" value={filter} onChange={(e) => setFilter(e.target.value)} style={{ marginBottom: 16 }} />
        <div className="cr-booklist">
          {list.map((b) => {
            return (
              <button key={b.id} onClick={() => setBook(b)}>
                {b.name} <s>{b.ch} ch</s>
              </button>
            );
          })}
        </div>
      </div>
    );
  }
  if (!chapter) {
    return (
      <div className="cr-pane">
        <button className="cr-btn" onClick={() => setBook(null)} style={{ marginBottom: 16 }}>← Books</button>
        <h1 className="cr-h1">{book.name}</h1>
        <p className="cr-sub">Choose a chapter.</p>
        <div className="cr-grid">
          {Array.from({ length: book.ch }).map((_, i) => <button key={i} onClick={() => setChapter(i + 1)}>{i + 1}</button>)}
        </div>
      </div>
    );
  }
  return (
    <div className="cr-pane">
      <button className="cr-btn" onClick={() => setChapter(null)} style={{ marginBottom: 16 }}>← Chapters</button>
      <h1 className="cr-h1">{book.name} {chapter}</h1>
      <p className="cr-sub">Choose the verse to start from. Every verse is in the library.</p>
      <div className="cr-grid">
        {Array.from({ length: 60 }).map((_, i) => (
          <button key={i} onClick={() => onJump({ book: book.id, chapter, verse: i + 1 })}>{i + 1}</button>
        ))}
      </div>
      <Source>
        Verse numbers past a chapter's real length simply have no text. The Berean Standard Bible prints
        sixteen disputed verses as omitted; those are marked when you land on them.
      </Source>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<CrossReference />);
</script>
</body>
</html>
